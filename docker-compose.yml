services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: productcatalog-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_password123!"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"Your_password123!\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: productcatalog-api
    depends_on:
      sqlserver:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      DatabaseProvider: "SqlServer"
      ConnectionStrings__SqlServer: "Server=sqlserver,1433;Database=ProductCatalogDb;User Id=sa;Password=Your_password123!;TrustServerCertificate=True;"
      Jwt__Secret: "CHANGE_ME_super-secret-signing-key-min-32-chars-long!!"
      Jwt__Issuer: "ProductCatalog.API"
      Jwt__Audience: "ProductCatalog.Client"

volumes:
  sqlserver-data:
